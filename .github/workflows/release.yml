name: Release

# The FIRST publish is manual and interactive — it needs a login and a 2FA OTP,
# and it must happen before npm's trusted publishing can be configured for the
# package. After that, tagging `v*` publishes with provenance and no secrets.
# See standards/publishing.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # required for npm trusted publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optionally gate on a GitHub environment named "npm" — adds a manual
    # approval step before publish runs. Repo Settings → Environments → npm.
    # environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run check-tracked
      - run: npm run typecheck
      # Same ordering as prepublishOnly — build before test. traps #11.
      - run: npm run build
      - run: npm test
      # Trusted publishing requires npm >= 11.5.1. Node 22's bundled npm may
      # lag, and `npm install -g npm@latest` has a known self-upgrade race on
      # hosted runners — use npx so we don't mutate the global install.
      # The first release of a package is published by hand (trusted publishing
      # can only be configured once the package exists — standards/publishing.md),
      # so the tag for that version must not go red trying to publish it again.
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$(node -p "require('./package.json').version") is already published — skipping."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npx -y npm@latest publish --provenance --access public
